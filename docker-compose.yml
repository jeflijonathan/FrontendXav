services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: presensi-frontend
    restart: unless-stopped
    ports:
      - "5174:80"
      - "8443:443"
    networks:
      - backend_net

networks:
  backend_net:
    external: true
    name: backend_smk_xaverius_palembang_default
